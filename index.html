<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My CarPlay</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #08090d;

  color: white;

  font-family: -apple-system, Arial, sans-serif;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

}

.dashboard {

  width: 100%;

  min-height: 100vh;

  padding: 25px;

  display: flex;

  flex-direction: column;

  gap: 20px;

}

.top {

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.clock {

  font-size: 52px;

  font-weight: 600;

  letter-spacing: -2px;

}

.date {

  color: #999;

  font-size: 15px;

}

.status {

  color: #aaa;

  font-size: 15px;

}

.main {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 18px;

  flex: 1;

}

.panel {

  background: #1b1d25;

  border-radius: 25px;

  padding: 24px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  min-height: 220px;

}

.map {

  background:

    linear-gradient(135deg, #252d32, #17252a);

  position: relative;

  overflow: hidden;

}

.map h2 {

  font-size: 25px;

}

.music {

  align-items: center;

  text-align: center;

}

.album {

  width: 110px;

  height: 110px;

  background: linear-gradient(135deg,#5969a8,#b47ac1);

  border-radius: 22px;

  display: grid;

  place-items: center;

  font-size: 45px;

  margin-bottom: 15px;

}

.music h2 {

  margin: 5px;

}

.music p {

  color: #aaa;

}

.controls {

  display: flex;

  gap: 25px;

  margin-top: 15px;

  align-items: center;

}

button {

  border: none;

  background: #30333e;

  color: white;

  padding: 13px 19px;

  border-radius: 30px;

  font-size: 20px;

}

.play {

  background: white;

  color: black;

}

.apps {

  display: flex;

  justify-content: center;

  gap: 20px;

  padding: 15px;

}

.app {

  width: 55px;

  height: 55px;

  border-radius: 16px;

  display: grid;

  place-items: center;

  font-size: 27px;

  background: #252936;

}

@media(max-width:600px) {

  .dashboard {

    padding: 16px;

  }

  .main {

    grid-template-columns: 1fr;

  }

  .clock {

    font-size: 40px;

  }

}

</style>

</head>

<body>

<div class="dashboard">

  <div class="top">

    <div>

      <div class="clock" id="clock">12:00</div>

      <div class="date" id="date">Loading date...</div>

    </div>

    <div class="status">● Connected</div>

  </div>

  <div class="main">

    <div class="panel map">

      <h2>Navigation</h2>

      <p>Your maps will appear here.</p>

      <div style="font-size:55px">📍</div>

      <p>Ready to go</p>

    </div>

    <div class="panel music">

      <div class="album">♫</div>

      <h2>Now Playing</h2>

      <p>My Music</p>

      <div class="controls">

        <button onclick="previous()">⏮</button>

        <button class="play" id="play"

          onclick="toggleMusic()">▶</button>

        <button onclick="next()">⏭</button>

      </div>

    </div>

  </div>

  <div class="apps">

    <div class="app">🗺️</div>

    <div class="app">🎵</div>

    <div class="app">📞</div>

    <div class="app">⚙️</div>

  </div>

</div>

<script>

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =

    now.toLocaleTimeString([], {

      hour: "numeric",

      minute: "2-digit"

    });

  document.getElementById("date").textContent =

    now.toLocaleDateString([], {

      weekday: "long",

      month: "long",

      day: "numeric"

    });

}

updateClock();

setInterval(updateClock, 1000);

let playing = false;

function toggleMusic() {

  playing = !playing;

  document.getElementById("play").textContent =

    playing ? "Ⅱ" : "▶";

}

function previous() {

  alert("Previous track");

}

function next() {

  alert("Next track");

}

</script>

</body>

</html>
